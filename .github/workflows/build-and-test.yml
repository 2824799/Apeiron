
name: Build and test

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]
    tags: [ 'alpha*' ]
  workflow_dispatch:
    inputs:
      full_compatibility:
        description: '运行全部历史服务端和客户端验证'
        type: boolean
        default: false

jobs:
  build-and-test:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.full_compatibility }}
    uses: GTNewHorizons/GTNH-Actions-Workflows/.github/workflows/build-and-test.yml@master
    with:
      timeout: 180
    secrets: inherit

  compatibility:
    name: 兼容验证
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      LIBGL_ALWAYS_SOFTWARE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: 安装虚拟显示环境
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libegl-mesa0 libgl1-mesa-dri libglx-mesa0 mesa-utils
      - name: 检查软件 OpenGL 环境
        run: xvfb-run -a glxinfo -B
      - name: 日常客户端验证
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.full_compatibility }}
        run: xvfb-run -a ./gradlew --no-daemon compatibilityClientCheck
      - name: 发布或手动完整验证
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.full_compatibility }}
        run: xvfb-run -a ./gradlew --no-daemon build compatibilityFullCheck
      - name: 保存兼容检查证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-evidence
          path: |
            build/reports/mixins/*.tsv
            build/compatibility/**/verification-passed.txt
            build/compatibility/**/dependencies.txt
            build/compatibility/**/artifact.sha256
            build/compatibility/**/logs/*.log
            build/compatibility/**/crash-reports/*.txt
          if-no-files-found: warn
