configurations.configureEach {
    resolutionStrategy {
        developmentModVersions.each { name, version ->
            force("com.github.GTNewHorizons:${name}:${version}")
        }
        force("com.falsepattern:chunkapi-mc1.7.10:0.8.4")
        force("com.falsepattern:endlessids-mc1.7.10:1.7.4")
        force("com.falsepattern:falsepatternlib-mc1.7.10:1.12.2")
        dependencySubstitution {
            substitute(module("com.github.GTNewHorizons:Baubles"))
                .using(module("com.github.GTNewHorizons:Baubles-Expanded:2.2.24-GTNH"))
                .withClassifier("dev")
                .because("Baubles-Expanded replaces Baubles")
        }
    }
    // CodeChickenCore supplies CodeChickenLib; its separate old artifact duplicates classes.
    exclude group: "com.github.GTNewHorizons", module: "CodeChickenLib"
    exclude group: "com.github.GTNewHorizons", module: "NotEnoughIDs"
    exclude group: "net.industrial-craft", module: "industrialcraft-2"
    exclude group: "curse.maven", module: "ic2-242638"
}

def developmentGalaxySpaceConfig = file("gradle/development-config/GalaxySpace/dimensions.conf")
tasks.named("runClient") {
    def dimensionsConfig = new File(workingDir, "config/GalaxySpace/dimensions.conf")
    inputs.file(developmentGalaxySpaceConfig)
    doFirst {
        if (!dimensionsConfig.exists()) {
            dimensionsConfig.parentFile.mkdirs()
            dimensionsConfig.bytes = developmentGalaxySpaceConfig.bytes
        }
    }
}
