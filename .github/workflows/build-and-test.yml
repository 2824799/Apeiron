
name: Build and test

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

jobs:
  build-and-test:
    uses: GTNewHorizons/GTNH-Actions-Workflows/.github/workflows/build-and-test.yml@master
    with:
      timeout: 180
    secrets: inherit

  historical-clients:
    name: 历史版本客户端兼容检查
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      LIBGL_ALWAYS_SOFTWARE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: 安装虚拟显示环境
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - name: 验证同一构建产物的四版客户端
        run: xvfb-run -a ./gradlew --no-daemon compatibilityClientCheck
      - name: 保存兼容检查证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-client-compatibility
          path: |
            build/compatibility/**/dependencies.txt
            build/compatibility/**/artifact.sha256
            build/compatibility/**/logs/*.log
            build/compatibility/**/crash-reports/*.txt
          if-no-files-found: warn
