import groovy.json.JsonSlurper

// Compile Apeiron once. Only the verification classpath changes between pack releases.
def compatibilityProfiles = new JsonSlurper().parse(file("compatibility/gtnh-profiles.json")).profiles
def compatibilityTasks = []
def compatibilityClientTasks = []
def compatibilityContractTasks = []
repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "GTNH dependency mirror"
                url = uri("https://nexus.gtnewhorizons.com/repository/public/")
            }
        }
        filter { includeGroup("it.unimi.dsi") }
    }
}

afterEvaluate {
    compatibilityProfiles.each { profile ->
        def suffix = profile.pack.replaceAll("[^A-Za-z0-9]", "_")
        def runtime = configurations.create("compatibilityRuntime_${suffix}") {
            canBeConsumed = false
            canBeResolved = true
            exclude group: "com.github.GTNewHorizons", module: "CodeChickenLib"
            exclude group: "net.industrial-craft", module: "industrialcraft-2"
            exclude group: "curse.maven", module: "ic2-242638"
            resolutionStrategy.setForcedModules(*profile.modules.collect { name, version ->
                "com.github.GTNewHorizons:${name}:${version}"
            })
            resolutionStrategy.dependencySubstitution {
                substitute(module("com.github.GTNewHorizons:Baubles"))
                    .using(module("com.github.GTNewHorizons:Baubles-Expanded:${profile.modules['Baubles-Expanded']}"))
                    .withClassifier("dev")
            }
        }
        ["GT5-Unofficial", "Applied-Energistics-2-Unofficial", "AE2FluidCraft-Rework",
            "ThaumicEnergistics", "Avaritia", "CodeChickenCore"].each { module ->
            dependencies.add(runtime.name, "com.github.GTNewHorizons:${module}:${profile.modules[module]}:dev")
        }
        dependencies { add(runtime.name, rfg.deobf("com.github.GTNewHorizons:Chisel:${profile.modules['Chisel']}")) }
        dependencies.add(runtime.name, "apeiron.development:industrialcraft-2:2.2.828-experimental:dev")
        dependencies.add(runtime.name, "thaumcraft:Thaumcraft:1.7.10-4.2.3.5:dev")
        [server: "runServer25", client: "runClient25"].each { side, runTask ->
            def launcher = tasks.named(runTask).get()
            def verificationDirectory = layout.buildDirectory.dir("compatibility/${profile.pack}" + (side == "client" ? "/client" : "")).get().asFile
            def configurationTree = fileTree(new File(verificationDirectory, "config"))
            def configurationDigest = new File(verificationDirectory, "configuration-input.sha256")
            def snapshot = tasks.register("compatibilityConfig_${suffix}_${side}") {
                inputs.files(configurationTree)
                outputs.file(configurationDigest)
                doLast {
                    def digest = java.security.MessageDigest.getInstance("SHA-256")
                    configurationTree.files.sort { it.absolutePath }.each { config ->
                        def relative = verificationDirectory.toPath().relativize(config.toPath()).toString()
                        digest.update(relative.getBytes("UTF-8"))
                        digest.update((byte) 0)
                        // Java properties and IC2 INI write fresh timestamp comments on every launch.
                        // Other files are hashed verbatim; actual properties and INI values remain inputs.
                        def content = config.name.endsWith('.properties') || relative.replace('\\', '/') == 'config/IC2.ini'
                            ? config.readLines('UTF-8').findAll {
                                !it.trim().startsWith('#') && !it.trim().startsWith(';')
                            }.join('\n').getBytes('UTF-8')
                            : config.bytes
                        digest.update(content)
                        digest.update((byte) 0)
                    }
                    configurationDigest.parentFile.mkdirs()
                    def hash = digest.digest().encodeHex().toString() + "\n"
                    if (!configurationDigest.isFile() || configurationDigest.text != hash) configurationDigest.text = hash
                }
            }
            def verification = tasks.register(side == "server" ? "compatibility_${suffix}" : "compatibilityClient_${suffix}", JavaExec) {
                group = "verification"
                description = "Verify the common Apeiron artifact with GTNH ${profile.pack} dependencies."
                dependsOn launcher.taskDependencies.getDependencies(launcher), snapshot
                mainClass.set(launcher.mainClass)
                javaLauncher.set(launcher.javaLauncher)
                workingDir = verificationDirectory
                def desktopDataDirectory = new File(workingDir, "xdg-data")
                if (side == "client") environment "XDG_DATA_HOME", desktopDataDirectory.absolutePath
                environment "APEIRON_VERIFY_COMPATIBILITY", "1"
                environment "APEIRON_VERIFY_EXIT", "1"
                environment "APEIRON_COMPATIBILITY_PROFILE", profile.pack
                jvmArgs "-Xms512m", "-Xmx4G"
                jvmArgs launcher.extraJvmArgs.get()
                timeout = java.time.Duration.ofMinutes(8)
                def replacements = runtime.resolvedConfiguration.resolvedArtifacts.collect {
                    it.moduleVersion.id.group + ":" + it.name
                } as Set
                def removed = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.findAll { artifact ->
                    def id = artifact.moduleVersion.id
                    id.group == "com.github.GTNewHorizons" || id.group == "apeiron.development" ||
                        replacements.contains(id.group + ":" + artifact.name) ||
                        (artifact.file.name.endsWith(".jar") && new java.util.zip.ZipFile(artifact.file).withCloseable { jar ->
                            jar.getEntry("mcmod.info") != null || jar.getEntry("META-INF/fml_cache_annotation.json") != null
                        })
                }.collect { it.file } as Set
                removed.addAll(configurations.runtimeClasspath.files.findAll { candidate ->
                    candidate.isFile() && candidate.name.endsWith(".jar") &&
                        new java.util.zip.ZipFile(candidate).withCloseable { jar ->
                            jar.getEntry("mcmod.info") != null || jar.getEntry("META-INF/fml_cache_annotation.json") != null
                        }
                })
                classpath = files(launcher.classpath.files.findAll { !removed.contains(it) }) + runtime
                systemProperties(launcher.systemProperties.collectEntries { key, value -> [(key.toString()): value.toString()] })
                args = launcher.args
                def resolved = runtime.resolvedConfiguration.resolvedArtifacts
                profile.modules.each { name, version ->
                    def actual = resolved.find { it.moduleVersion.id.group == "com.github.GTNewHorizons" && it.name == name }
                    if (actual != null && actual.moduleVersion.id.version != version)
                        throw new GradleException("${profile.pack}: ${name} resolved ${actual.moduleVersion.id.version}, expected ${version}")
                }
                def dependencyReport = resolved.collect {
                    it.moduleVersion.id.toString() + ":" + (it.classifier ?: "")
                }.sort().join("\n") + "\n"
                def artifact = tasks.named("jar").get().archiveFile.get().asFile
                inputs.file(tasks.named("verificationJar").flatMap { it.archiveFile })
                inputs.file(file("compatibility/gtnh-profiles.json"))
                inputs.file(configurationDigest)
                def receipt = new File(workingDir, "verification-passed.txt")
                outputs.file(receipt)
                doFirst {
                    workingDir.mkdirs()
                    receipt.delete()
                    if (side == "client") java.nio.file.Files.createDirectories(desktopDataDirectory.toPath())
                    new File(workingDir, "eula.txt").text = "eula=true\n"
                    if (side == "server") new File(workingDir, "server.properties").text =
                        "server-port=0\nonline-mode=false\nlevel-name=apeiron-compatibility\n"
                    new File(workingDir, "dependencies.txt").text = dependencyReport
                    new File(workingDir, "logs/latest.log").delete()
                    new File(workingDir, "logs/fml-${side}-latest.log").delete()
                    new File(workingDir, "artifact.sha256").text = java.security.MessageDigest.getInstance("SHA-256")
                        .digest(artifact.bytes).encodeHex().toString() + "  " + artifact.name + "\n"
                }
                doLast {
                    def log = new File(workingDir, "logs/fml-${side}-latest.log")
                    def marker = "Apeiron compatibility verification passed: ${profile.pack}"
                    if (!log.isFile() || !log.text.contains(marker))
                        throw new GradleException("${profile.pack}: compatibility self-check did not complete; see ${workingDir}/logs")
                    receipt.text = marker + " side=" + side + "\n" + new File(workingDir, "artifact.sha256").text
                }
            }
            if (side == "server") {
                compatibilityContractTasks.add(tasks.register("compatibilityContracts_${suffix}", JavaExec) {
                    group = "verification"
                    description = "Check all selected Mixin target methods against GTNH ${profile.pack} without starting Minecraft."
                    dependsOn tasks.named("verificationClasses"), tasks.named("jar"), launcher.taskDependencies.getDependencies(launcher)
                    classpath = sourceSets.verification.output + verification.get().classpath
                    mainClass = "com.silvia.apeiron.verification.MixinContractCheck"
                    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
                    def report = layout.buildDirectory.file("reports/mixins/${profile.pack}.tsv")
                    args report.get().asFile.absolutePath
                    inputs.file(file("compatibility/gtnh-profiles.json"))
                    outputs.file(report)
                })
            }
            def precedingChecks = (compatibilityTasks + compatibilityClientTasks).toList()
            verification.configure { mustRunAfter(precedingChecks) }
            (side == "server" ? compatibilityTasks : compatibilityClientTasks).add(verification)
        }
    }
}

tasks.register("compatibilityCheck") {
    group = "verification"
    description = "Check every historical target contract and run the newest supported server profile."
    dependsOn compatibilityContractTasks
    dependsOn provider { compatibilityTasks.takeRight(1) }
}

tasks.register("compatibilityClientCheck") {
    group = "verification"
    description = "Run GUI and rendering regressions on the newest supported client profile."
    dependsOn provider { compatibilityClientTasks.takeRight(1) }
}

tasks.register("compatibilityFullCheck") {
    group = "verification"
    description = "Release audit: run all historical server and client profiles, plus static contracts."
    dependsOn compatibilityContractTasks, compatibilityTasks, compatibilityClientTasks
}

tasks.named("check") { dependsOn("compatibilityCheck") }
